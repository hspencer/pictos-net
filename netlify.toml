[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "vite"
  targetPort = 3000
  port = 9001
  autoLaunch = false

[functions]
  external_node_modules = ["@anthropic-ai/sdk", "google-auth-library"]
  node_bundler = "esbuild"

# Netlify synchronous functions have a non-configurable 60s limit. Text
# provider budgets are bounded in code; long-running work uses background jobs.

[functions."api-recraft"]
  # Recraft SVG generation + fetch
  timeout = 26

[functions."api-batch-create"]
  # Batch generation: JSONL upload to GCS + Vertex batch job creation
  timeout = 26

[functions."api-pipeline-batch-create"]
  # Full-pipeline batch gate: writes grant blob + awaits 202 from background worker
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: blocks inline scripts (protects against SVG/XSS injection).
    # style-src 'unsafe-inline' required — SVG editor injects <style> tags dynamically.
    # wasm-unsafe-eval required — VTracer WASM (phase 4, manual vectorizer).
    # nominatim.openstreetmap.org — geo-context autocomplete in settings.
    # pictos.net + next.pictos.net — admin.html consulta api-usage-report en ambos deploys.
    # *.googleusercontent.com — Google profile photos for the logged-in user
    # avatar. Google serves them from several subdomains (lh3-lh6, regional
    # variants), so a single-host allowance intermittently breaks the avatar.
    # fonts.googleapis.com + fonts.gstatic.com — netlify-identity-widget loads
    # Fira Code from Google Fonts and injects the <link> into the host page.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleusercontent.com https://www.gravatar.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://nominatim.openstreetmap.org https://pictos.net https://next.pictos.net; media-src 'self' data: blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/libraries/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[build.environment]
  NODE_VERSION = "22"

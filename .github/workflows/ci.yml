name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strict type check
        run: npm run typecheck
      - name: Canonical contracts
        run: npm run test:schemas
      - name: Unit tests without live providers
        shell: bash
        run: |
          tests=(netlify/functions/_shared/*.test.mjs scripts/*.test.mjs)
          for file in services/*.test.ts; do
            [[ "$file" == *.integration.test.ts ]] || tests+=("$file")
          done
          node --test --experimental-strip-types "${tests[@]}"
      - name: Independent product snapshots
        shell: bash
        run: |
          source_commit=$(git rev-parse HEAD)
          for product in nlu-schema pictogram-composition-schema mf-svg-schema; do
            target="$RUNNER_TEMP/$product"
            node scripts/export-schema.mjs committed "$product" --ref "$source_commit" --output "$target"
            npm ci --prefix "$target" --ignore-scripts
            npm test --prefix "$target"
          done
